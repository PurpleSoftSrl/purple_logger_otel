name: purple_logger_otel
description: OpenTelemetry bridge for purple_logger — routes structured log events to OTLP via dartastic_opentelemetry.
version: 1.0.0
homepage: https://github.com/purplesoft-ai/purple_logger

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  purple_logger:
    path: ../purple_logger
  dartastic_opentelemetry: ^1.1.0-beta.6

dev_dependencies:
  test: ^1.25.0

topics:
  - logging
  - opentelemetry
  - otlp
  - observability
  - telemetry